<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ComicCraft — AI Comic Story Creator</title><link rel="stylesheet" href="/static/style.css"></head><body class="home"><div class="hero-bg"></div><main class="create-wrap"><div class="logo">📖 <b>ComicCraft</b></div><section class="create-card"><div class="mini-icon">✨</div><h1>Create Your Comic</h1><p class="sub">Turn your idea into an illustrated story in seconds.</p><form action="/generate" method="post"><label>Story Prompt</label><textarea name="story_prompt" required placeholder="A clever fox discovers a hidden secret in the forest..."></textarea><label>Main Character Name</label><input name="character_name" required placeholder="e.g. Luna"><label>Setting</label><select name="setting"><option>Forest</option><option>School</option><option>Space</option><option>City</option></select><label>Story Tone</label><select name="tone"><option>Light-hearted</option><option>Dramatic</option><option>Poetic</option><option>Funny</option></select><label>Art Style</label><select name="art_style"><option>Comic Book</option><option>Anime</option><option>Pixel Art</option><option>Realistic</option></select><button class="primary">✨ Generate Comic</button></form><p class="note">No API key required for this demo.</p></section></main></body></html>
