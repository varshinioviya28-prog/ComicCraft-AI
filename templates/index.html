<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCraft - AI Comic Story Creator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.85)), 
                        url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #1a1a1a;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #444;
        }
        input[type="text"], textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            background: #fafafa;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        button:hover {
            background-color: #4338ca;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ComicCraft AI Creator</h1>
        <form action="/generate" method="post">
            <div class="form-group">
                <label for="prompt">Story Prompt</label>
                <textarea id="prompt" name="prompt" placeholder="Enter your story idea..." required></textarea>
            </div>
            <div class="form-group">
                <label for="character">Main Character Name</label>
                <input type="text" id="character" name="character" placeholder="e.g. Leo the Brave" required>
            </div>
            <div class="form-group">
                <label for="setting">Setting</label>
                <input type="text" id="setting" name="setting" placeholder="e.g. Futuristic City, Dark Forest" required>
            </div>
            <div class="form-group">
                <label for="tone">Story Tone</label>
                <select id="tone" name="tone">
                    <option value="Action">Action</option>
                    <option value="Comedy">Comedy</option>
                    <option value="Mystery">Mystery</option>
                    <option value="Adventure">Adventure</option>
                </select>
            </div>
            <div class="form-group">
                <label for="style">Art Style</label>
                <select id="style" name="style">
                    <option value="Anime">Anime</option>
                    <option value="Vintage Comic">Vintage Comic</option>
                    <option value="Graphic Novel">Graphic Novel</option>
                    <option value="3D Cartoon">3D Cartoon</option>
                </select>
            </div>
            <button type="submit">Generate Comic</button>
        </form>
    </div>
</body>
</html>
