<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Export Successful</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f4f6f9;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 450px;
        }
        h2 { color: #10b981; }
        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            background: #4f46e5;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
        }
        a:hover { background: #4338ca; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Export Successful!</h2>
        <p>Your comic has been downloaded as a PDF.</p>
        <a href="/">Create Another Comic</a>
    </div>

</html>
